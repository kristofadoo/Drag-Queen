["supra","Suprima A80",4,90000,11,320,1500,1.1,1.9,4.5,1.28,"sawtooth"],["r34","Skyliner R34",4,110000,12,280,1560,1.12,1.9,4.6,1.35,"sawtooth"],["nsx","Enessex NSX",4,140000,14,290,1350,1.12,1.8,4.4,1.17,"triangle"],["gtr","Godzilla GT-R",5,250000,16,480,1700,1.2,2.2,4.7,1.37,"sawtooth"]].map(a=>({id:a[0],name:a[1],tier:a[2],price:a[3]*.5,lvl:a[4],hp:a[5],kg:a[6],grip:a[7],em:a[8],len:a[9],hgt:a[10],snd:a[11],opt:.58+a[0].length%5*.05,tp:.4+a[0].length%4*.07}));

function spec(id){const c=CD[id],s=S.cars[id],u=s.up,t=s.tune;let em=0,wt=0,gr=0;
 CATS[0][1].slice(0,u[0]).forEach(p=>em+=p[1]);CATS[2][1].slice(0,u[2]).forEach(p=>wt+=p[1]);CATS[3][1].slice(0,u[3]).forEach(p=>gr+=p[1]);
 const hp=c.hp*(1+em*c.em),kg=c.kg*(1-wt),grip=(c.grip+gr+(s.cos.low?.03:0))*(1-Math.abs(t.tp-c.tp)*.3)*(1-Math.abs(t.wb-.55)*.25)*{A:1.15,F:.93,R:1}[DR[id]];
 const vt=Math.min(105,52+95*hp/kg)*(1-.09*t.fd)*{A:.99,F:.98,R:1.02}[DR[id]];
 return{drv:DR[id],lk:.15-.012*u[1],hp,kg,grip,dtm:1+.025*u[1],nos:u[4],fd:t.fd,opt:c.opt,lr:t.lr,gt:[.26,.4,.56,.76,1].map(x=>x*vt)}}
const mk=(gm=1)=>({v:0,d:0,g:0,t:0,lock:0,gm,r:0,a:0});
function step(s,c,dt,n){const r=s.r=s.v/c.gt[s.g],f=r>1?.25:r<.8?.45+.55*Math.pow(r/.8,1.5):1;
 let P=c.hp*745.7*.88*f*(n?1.3+.12*c.nos:1);if(s.lock>0){P*=.2;s.lock-=dt}
 let a=Math.min(P/(c.kg*Math.max(s.v,4)),c.grip*9.81*s.gm);
 a=a*c.dtm*(1+.04*c.fd*Math.max(0,1-s.v/60))-.39*s.v*s.v/c.kg;s.gm=Math.min(1,s.gm+dt*.5);
 s.a=a;s.v+=a*dt;s.d+=s.v*dt;s.t+=dt}
const shift=(s,c)=>{if(s.g<4){const q=s.r;s.g++;s.lock=c&&c.lk||.12;return q}return-1};
